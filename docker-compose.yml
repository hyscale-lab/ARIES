services:
  aries:
    build: .
    image: aries:latest
    container_name: aries
    # Host networking lets the in-container E2B bridge listener be reachable by
    # the sibling task-sandbox containers on Linux. On Docker Desktop (macOS)
    # host networking is emulated; see note for the caveat.
    network_mode: host
    volumes:
      - ./profiles:/app/profiles
      - ./traces:/app/traces
      - ./configs:/app/configs
      - ./docs:/app/docs
      - ./runs:/app/runs
      # Sibling containers (agent + task sandboxes) are created on the host
      # Docker engine through this socket.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PROFILE=profiles/openclaw-tb2-fix-git-deepseek-e2b.json
      # Provide the key on the host (export DEEPSEEK_API_KEY=... or use a .env
      # file). Do NOT hard-code secrets in this file.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    command: ["profiles/openclaw-tb2-fix-git-deepseek-e2b.json"]
