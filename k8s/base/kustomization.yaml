apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - job.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: aries

# Overlays override the image name/tag with `images:`.
images:
  - name: aries
    newTag: latest
