apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OpenClaw harness gateway Deployment + routing Service. Kept as a separate
# component because ARIES itself runs out-of-cluster; apply this into the
# cluster and reach the gateway via `kubectl port-forward svc/aries-openclaw`.
resources:
  - deployment.yaml
  - service.yaml
