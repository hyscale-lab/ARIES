# Permissions ARIES needs to act as the Tool Sandbox owner on Kubernetes:
# create/manage the per-task sandbox pods, exec into them, and stream their
# logs. Scoped to the aries namespace (Role, not ClusterRole) so ARIES cannot
# touch workloads elsewhere in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aries-sandbox
  namespace: aries
rules:
  # Sandbox and agent pod lifecycle.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  # Attached process execution (the pod exec subresource), log streaming, and
  # the port-forward the Kubernetes harness uses to reach the agent gateway.
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach", "pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # The per-task Service the Kubernetes harness creates to route to the agent.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "delete"]
  # Access-token / config material handed to each task sandbox.
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["create", "get", "list", "delete"]
  # The per-task deny-all NetworkPolicy that isolates each sandbox pod. Created
  # before the pod and deleted after it, so ARIES needs the full lifecycle.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aries-sandbox
  namespace: aries
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aries-sandbox
subjects:
  - kind: ServiceAccount
    name: aries
    namespace: aries
---
# Pod resource telemetry reads the kubelet Summary API through the API server
# proxy (/api/v1/nodes/<node>/proxy/stats/summary), which reports the cumulative
# usageCoreNanoSeconds counter pkg/monitor needs. `nodes` is a cluster-scoped
# resource, so this cannot be folded into the namespaced Role above.
#
# This is the one privilege ARIES holds outside its own namespace. It is
# read-only and confined to a single subresource: `get` on nodes/proxy permits
# reading kubelet endpoints, and nothing else — no node mutation, and no access
# to workloads in other namespaces. Drop this ClusterRole and its binding if you
# do not want pod telemetry; the sandbox and harness still work, and
# resources.jsonl is simply empty.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aries-node-metrics
rules:
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aries-node-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aries-node-metrics
subjects:
  - kind: ServiceAccount
    name: aries
    namespace: aries
