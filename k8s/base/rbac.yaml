# Permissions ARIES needs to act as the Tool Sandbox owner on Kubernetes:
# create/manage the per-task sandbox pods, exec into them, and stream their
# logs. Scoped to the aries namespace (Role, not ClusterRole) so ARIES cannot
# touch workloads elsewhere in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aries-sandbox
  namespace: aries
rules:
  # Sandbox pod lifecycle.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  # Attached process execution (the pod exec subresource) and log streaming.
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Access-token / config material handed to each task sandbox.
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aries-sandbox
  namespace: aries
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aries-sandbox
subjects:
  - kind: ServiceAccount
    name: aries
    namespace: aries
