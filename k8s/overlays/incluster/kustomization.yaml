apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ARIES running INSIDE the cluster (Option A for remote clusters). ARIES, the
# bridge, and the agent/sandbox pods all share the cluster network, so the
# agent's reverse SSH hop to the bridge is pod-to-pod. The bridge advertises
# ARIES's own pod IP via the downward API ($POD_IP), so no external routing is
# needed.

namespace: aries

resources:
  - ../../base
  # StorageClass + PV + PVC for run artifacts. Defined statically because a bare
  # kubeadm cluster has no dynamic provisioner.
  - storage.yaml

secretGenerator:
  # DEEPSEEK_API_KEY from a gitignored secret.env (cp secret.env.example secret.env).
  - name: aries-model
    envs:
      - secret.env

  # Registry credentials for pulling the ARIES image. base/deployment.yaml references
  # this Secret by name through imagePullSecrets, so the name is load-bearing.
  # registry.json is gitignored; generate it with your own credentials:
  #
  #   kubectl create secret docker-registry aries-registry \
  #     --docker-server=https://index.docker.io/v1/ \
  #     --docker-username=<user> --docker-password=<access-token> \
  #     --dry-run=client -o jsonpath='{.data.\.dockerconfigjson}' \
  #     | base64 -d > registry.json
  - name: aries-registry
    type: kubernetes.io/dockerconfigjson
    files:
      - .dockerconfigjson=registry.json

generatorOptions:
  disableNameSuffixHash: true

images:
  # Push the aries image to a registry your cluster can pull, and set it here.
  - name: aries
    newName: jingxiang212/aries
    newTag: latest

patches:
  # Select the in-cluster profile and inject POD_IP for $POD_IP advertise_host.
  - target:
      kind: Deployment
      name: aries
    patch: |-
      # env[0] is ARIES_PROFILE — the profile the documented `kubectl exec`
      # line runs. The pod idles, so this starts nothing on its own.
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: profiles/openclaw-tb2-fix-git-deepseek-k8s-incluster.json
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      # The image tag is mutable (:latest); always re-pull so redeploys pick up
      # a freshly pushed image.
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      # Pin ARIES to a node the installer labelled and tainted
      # aries.dev/role=aries. Both halves are needed: the nodeSelector pulls the
      # pod onto that node, the toleration gets it past the taint. This lives in
      # the overlay rather than base so the local (kind/minikube) path keeps
      # working on a cluster with no role labels.
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          aries.dev/role: aries
      # Persist run artifacts. base uses an emptyDir, which dies with the pod;
      # swap the whole volume for the PVC defined in storage.yaml.
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: runs
          persistentVolumeClaim:
            claimName: aries-runs
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: aries.dev/role
            operator: Equal
            value: aries
            effect: NoSchedule
