# Local cluster (kind/minikube).
#
#   make image-bridge BRIDGE_IMAGE=aries-bridge:latest
#   kind load docker-image aries-bridge:latest    # or: minikube image load aries-bridge:latest
#   helm upgrade --install aries ./k8s/aries --namespace aries --create-namespace \
#     -f ./k8s/aries/values-local.yaml

bridge:
  image:
    repository: aries-bridge
    tag: latest
    # The image is side-loaded into the node, so never pull from a registry.
    pullPolicy: Never
  # A single-node local cluster usually cannot satisfy the cluster requests.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

# No registry to authenticate against: the node already holds the image. An
# empty list is what makes this work — a pull secret referencing a Secret that
# does not exist would be a kubelet warning here and nothing more, but leaving
# it out is clearer.
imagePullSecrets: []
registry:
  create: false
