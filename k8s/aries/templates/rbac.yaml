{{- if .Values.rbac.create }}
# Permissions ARIES needs to act as the Tool Sandbox owner on Kubernetes:
# create/manage the per-task sandbox pods, exec into them, and stream their
# logs. Scoped to the release namespace (Role, not ClusterRole) so ARIES cannot
# touch workloads elsewhere in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aries.fullname" . }}-sandbox
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aries.labels" . | nindent 4 }}
rules:
  # Harness, sandbox and bridge pods: one per runtime, created and deleted by
  # the runner. `watch` backs `kubectl wait`.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  # exec stages files and runs commands; portforward reaches the harness
  # gateway and the bridge's control port from outside the cluster.
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # One policy per sandbox, plus one per run for the bridge.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "delete"]
  # One Service per sandbox that declares a task service, so the harness can
  # reach a benchmark's search engine by a stable name.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "delete"]
  # agent-sandbox Sandboxes, when sandbox.deployment.kubernetes.agent_sandbox
  # creates sandbox pods through its controller. `watch` backs `kubectl wait`.
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # With warm_pool, the run's templates and pools, and one claim per sandbox;
  # `patch` on pods gives a claimed pod its task's identity.
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxwarmpools", "sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aries.fullname" . }}-sandbox
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aries.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aries.fullname" . }}-sandbox
subjects:
  - kind: ServiceAccount
    name: {{ include "aries.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
