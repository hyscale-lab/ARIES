{{- if .Values.model.create }}
{{- if not .Values.model.apiKey }}
{{- fail "model.apiKey is empty: copy secret.yaml.example to secret.yaml, set the key, and pass -f secret.yaml (or set model.create=false to use a Secret you created yourself)" }}
{{- end }}
# The model API key ARIES reads from $DEEPSEEK_API_KEY.
#
# Rendered from values, so the key is also stored in this release's Helm
# metadata Secret in this namespace and is readable with
# `helm get values aries`. Anyone who can read Secrets here can read the key
# either way; the difference is that Helm also keeps it in the release history.
# Set model.create=false and create the Secret yourself to avoid that.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.model.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aries.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.model.key }}: {{ .Values.model.apiKey | quote }}
{{- end }}
{{- if .Values.registry.create }}
{{- if not .Values.registry.dockerconfigjson }}
{{- fail "registry.create is true but registry.dockerconfigjson is empty: set it in secret.yaml, or set registry.create=false for a public image" }}
{{- end }}
---
# Registry credentials for pulling the ARIES image. The Deployment references
# this Secret by name through imagePullSecrets, so the name is load-bearing.
apiVersion: v1
kind: Secret
metadata:
  name: aries-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aries.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |-
    {{- .Values.registry.dockerconfigjson | toString | nindent 4 }}
{{- end }}
