# Defaults for the ARIES chart.
#
# The chart deploys what ARIES needs *inside* the cluster. The runner itself is
# not here: it runs as a process on a host outside the cluster (see
# `aries-setup setup_runner`) and reaches the cluster with kubectl.
#
#   - the tool bridge pod (aries-bridge), which serves every task's SSH bridge
#   - the runner's ServiceAccount, its namespaced Role and a token for it
#   - the nodes/proxy ClusterRole for pod telemetry
#   - the Grafana dashboard ConfigMap
#
# Pick an environment file on top:
#
#   values-local.yaml       kind/minikube, bridge image loaded into the node
#   values-cluster.yaml     remote kubeadm cluster, bridge image pulled
#
# The bridge image is public (docker.io/jingxiang212/aries-bridge), so no
# credentials are needed. For a private registry, put the pull document in the
# gitignored secret.yaml (see secret.yaml.example) and set registry.create.

# Resource names are kept stable at "aries" regardless of the release name, so
# the ServiceAccount is always "aries" and the bridge "aries-bridge". Clear this
# to get standard release-prefixed names.
fullnameOverride: aries

# Pull secret for a private bridge image: [{name: aries-registry}] with
# registry.create, or the name of a Secret you created yourself. Empty for the
# public image.
imagePullSecrets: []

registry:
  # Render the aries-registry dockerconfigjson Secret from
  # registry.dockerconfigjson in secret.yaml. Only for a private image.
  create: false
  # A full Docker config document. Set this in secret.yaml, never here.
  dockerconfigjson: ""

bridge:
  # Off only for a Docker-only setup; every profile with
  # bridge.deployment "kubernetes" needs it.
  enabled: true
  image:
    # Built from Dockerfile.bridge and published with
    #   make image-bridge BRIDGE_IMAGE=jingxiang212/aries-bridge:latest
    #   docker push jingxiang212/aries-bridge:latest
    # It holds only aries-bridge and kubectl, which is why it can be public.
    repository: jingxiang212/aries-bridge
    tag: latest
    # :latest is mutable, so always re-pull or a redeploy silently keeps the
    # old bridge. values-local sets Never for a side-loaded image.
    pullPolicy: Always
  # Admit connections only from ARIES harness pods. Needs a CNI that enforces
  # NetworkPolicy (Calico does; flannel silently does not).
  networkPolicy:
    enabled: true
  # The bridge's cost is one `kubectl exec` process per tool call. Keep the
  # limit well clear of throttling: a throttled bridge adds latency to every
  # tool call, which is exactly what experiments measure.
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      cpu: "4"
      memory: 2Gi

rbac:
  # The runner's namespaced Role: sandbox and agent pod lifecycle, exec (into
  # sandboxes and the bridge pod), logs, services, configmaps/secrets and
  # NetworkPolicies. The runner cannot work without it.
  create: true
  # The one privilege the runner holds outside its namespace: `get` on
  # nodes/proxy, so pod telemetry can read the kubelet Summary API through the
  # API server. Read-only and confined to that subresource. Set false to drop
  # it; the sandbox and harness still work and resources.jsonl is simply empty.
  nodeMetrics: true

serviceAccount:
  # The runner's identity, plus a long-lived token Secret setup_runner builds
  # the runner host's kubeconfig from.
  create: true
  name: aries

# OpenClaw harness gateway: a Deployment plus a ClusterIP Service. Off by
# default because ARIES's Kubernetes harness backend creates its own per-task
# agent pods; these static resources are the reference/template for that flow,
# useful when driving a single long-lived gateway by port-forward.
openclaw:
  enabled: false
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: "2026.7.1"
    pullPolicy: IfNotPresent
  service:
    # ClusterIP is deliberate: reach it with
    # `kubectl -n aries port-forward svc/aries-openclaw 18789:18789`, which
    # needs no node-IP or cloud load-balancer access and works against any
    # cluster. NodePort/LoadBalancer only if you want direct addressing.
    type: ClusterIP
    port: 18789
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

# The ARIES Grafana dashboard, shipped as a ConfigMap for Grafana's dashboard
# sidecar to pick up. It plots CPU, memory and CFS throttling for pods in this
# namespace (bridge, harness and sandbox pods) from the kubelet's cAdvisor
# endpoint, which kube-prometheus-stack already scrapes every 10s. The runner
# is a host process, so it does not appear.
#
# On by default: the ConfigMap is inert without the monitoring stack. It does
# need k8s/grafana/values.yaml's sidecar.dashboards.searchNamespace=ALL, since
# it lives in this namespace rather than the monitoring one.
grafanaDashboard:
  enabled: true
  # Both must match the monitoring release's sidecar.dashboards.label and
  # .labelValue. kube-prometheus-stack sets the value to "1" and the sidecar
  # matches on it, so a mismatch means the dashboard is never loaded and
  # nothing reports an error.
  label: grafana_dashboard
  labelValue: "1"
  # Grafana folder to file it under. Empty puts it in the sidecar's default.
  folder: ARIES

# Extra labels applied to every resource.
commonLabels: {}
