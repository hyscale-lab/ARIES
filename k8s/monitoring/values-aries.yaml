# ARIES's values for kube-prometheus-stack, which `k8s/apply-aries.sh
# --monitoring` installs. The stack runs on the node labelled
# aries/role=monitoring, which k8s/create-cluster.sh sets on the runner, so it
# never shares a measured worker's CPU.

# cAdvisor is the scrape that matters for ARIES: it carries the per-pod CPU,
# memory and throttling series the dashboard plots. One second resolves a tool
# call; the stack's default hides it.
#
# A scrape is only as fresh as the kubelet's cAdvisor housekeeping, which is 10s
# unless the kubelet runs with --housekeeping-interval. Without that flag a 1s
# scrape mostly re-reads the same observation. k8s/create-cluster.sh sets it
# from kubelet_housekeeping_interval in cluster.json.
kubelet:
  serviceMonitor:
    cAdvisor: true
    cAdvisorInterval: 1s

prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    nodeSelector:
      aries/role: monitoring
    # The ARIES chart's cAdvisor PodMonitor carries no label of this release,
    # so Prometheus must select monitors from every release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

prometheusOperator:
  nodeSelector:
    aries/role: monitoring
  admissionWebhooks:
    deployment:
      nodeSelector:
        aries/role: monitoring
    patch:
      nodeSelector:
        aries/role: monitoring

kube-state-metrics:
  nodeSelector:
    aries/role: monitoring

grafana:
  nodeSelector:
    aries/role: monitoring
  sidecar:
    dashboards:
      enabled: true
      # The ARIES dashboard ConfigMap lives in the ARIES namespace, not the
      # monitoring one, so the sidecar must look everywhere.
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

# ARIES reads measurements, not alerts.
alertmanager:
  enabled: false

# kubeadm binds these control-plane endpoints to the loopback address, where
# Prometheus cannot scrape them; ARIES does not use them.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
