name: Feature Request
description: Suggest an idea or new feature for the project.
title: "[Feature]: "
labels: ["Feature"]
projects: ["hyscale-lab/projects/7"]
type: feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to share your idea! Please fill out the sections below to help us understand the scope and goal of the proposed feature.
  - type: dropdown
    id: component
    attributes:
      label: Which component does this feature relate to?
      description: Select the primary area(s) this enhancement impacts.
      multiple: true
      options:
        - Agent Harness
        - Benchmark
        - LLM Backend
        - Tool Bridge
        - Tool Sandbox
        - Misc
  - type: textarea
    id: problem-statement
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or pain point is (e.g., "I'm always frustrated when...").
      placeholder: Describe the current limitation or pain point...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen and how the feature should behave.
      placeholder: Describe the proposed behavior or implementation workflow...
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to contribute
      description: Would you be open to helping implement this feature?
      options:
        - label: I would be willing to submit a Pull Request for this feature.