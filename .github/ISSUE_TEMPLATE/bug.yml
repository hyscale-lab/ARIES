name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: ["Bug"]
projects: ["hyscale-lab/projects/7"]
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: dropdown
    id: component
    attributes:
      label: Which component do you suspect the issue is related to?
      description: This will help us triage the issue faster.
      multiple: true
      options:
        - Agent Harness
        - Benchmark
        - LLM Backend
        - Tool Bridge
        - Tool Sandbox
        - Misc
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A bug happened!"
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Please provide a list of steps to reproduce the issue.
      placeholder: 1. Step one\n2. Step two\n3. Step three
      value: "1. Step one\n2. Step two\n3. Step three"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
