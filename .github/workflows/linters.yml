name: Linters

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check spelling
        uses: rojopolis/spellcheck-github-actions@0.63.0
        with:
          config_path: .github/configs/spellcheck.yml

  commitlint:
    name: Commitlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint commits
        uses: dafnik/commitlint@v1

  markdown-link-check:
    name: Markdown links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --config .github/configs/lychee.toml
            README.md
            'docs/**/*.md'
