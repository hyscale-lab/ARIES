syntax = "proto3";
package aries.bridge.control.v1;
option go_package = "github.com/hyscale-lab/aries/pkg/bridge/control/v1;controlv1";

service BridgeControl {
  rpc RegisterSandbox(RegisterSandboxRequest) returns (SandboxAccess);
  rpc GetSandbox(SandboxRequest) returns (SandboxAccess);
  rpc ReleaseSandbox(SandboxRequest) returns (SandboxAccess);
}
enum State { STATE_UNSPECIFIED = 0; REGISTERING = 1; READY = 2; RELEASING = 3; RELEASED = 4; }
message Target {
  reserved 1 to 5, 7 to 11, 14, 15;
  reserved "version", "run_id", "task_id", "occurrence_id", "backend", "runtime_name", "expected_labels", "max_input_bytes", "max_output_bytes";
  string runtime_id = 6;
  string workdir = 12;
  string exec_user = 13;
}
message Metadata { string task_id = 1; }
message RegisterSandboxRequest { string sandbox_id = 1; Target target = 2; Metadata metadata = 3; }
message SandboxRequest { string sandbox_id = 1; }
message Endpoint {
  reserved 1, 5;
  reserved "host", "host_key";
  uint32 port = 2;
  string user = 3;
  string transport = 4;
}
message Artifact { string name = 1; string status = 2; int64 size = 3; string sha256 = 4; }
message SandboxAccess {
  string sandbox_id = 1;
  State state = 2;
  Endpoint endpoint = 3;
  repeated Artifact artifacts = 4;
  string error = 5;
  string cleanup_error = 6;
}
